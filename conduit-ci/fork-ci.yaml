# Yaegi fork-ci as a Conduit generic definition (pilot).
# Mirrors .github/workflows/fork-ci.yml (disabled during the pilot):
# the local gate needs no checkout (steps run in the yaegi tree via
# absolute path) and no setup-go (host toolchain builds go.mod 1.21
# clean — proven green locally).
# Fire with: conduit_run kind=generic + this file as definition.
commands:
  - cd D:/Proyectos/yaegi && go version
  - cd D:/Proyectos/yaegi && go vet ./interp/... ./internal/... ./extract/...
  - cd D:/Proyectos/yaegi && go vet ./stdlib/generic/...
  - cd D:/Proyectos/yaegi && go test ./internal/unsafe2 -count=1
  - cd D:/Proyectos/yaegi && go test ./interp -run 'TestGenericFunc' -count=1
